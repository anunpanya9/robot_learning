[project]
name = "robot_learning"
version = "0.1.0"
description = "VLA pick & place บน SO-101 ใน MuJoCo → LeRobot → SmolVLA → Voice"
requires-python = ">=3.10"
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# assets (MJCF/meshes) ไม่ได้อยู่ใน src → อ้างด้วย path จาก repo root แทน
"robot_learning" = ["py.typed"]
