# นิยามวัตถุบนโต๊ะ: 5 สี x 2 ทรง (กลม/เหลี่ยม)
# ใช้โดย scene_randomizer เพื่อสุ่มเลือก/วางวัตถุ และ build task string
#
# หน่วย: เมตร (MuJoCo SI). base ของหุ่นอยู่ที่ origin (0,0,0)
# workspace ที่ gripper เอื้อมถึง: x ~ 0.18-0.32, y ~ -0.12..0.12 (โซนหน้าหุ่น)

colors:
  red:    [0.85, 0.12, 0.12, 1.0]
  yellow: [0.95, 0.80, 0.10, 1.0]
  green:  [0.15, 0.65, 0.20, 1.0]
  blue:   [0.15, 0.35, 0.85, 1.0]
  white:  [0.92, 0.92, 0.92, 1.0]

# ทรงของวัตถุ (คำที่ LLM/dataset ใช้เรียก)
# ขนาดต้องเล็กพอให้ jaw ของ SO-101 คีบได้: jaw ปิดสุดเหลือช่อง ~1.3cm,
# ตอนคีบวัตถุ jaw บีบที่ ~1.5-2cm → วัตถุเต็มควร ~1.6-2.0cm
#
# PHASE 1: เริ่มด้วย ball อย่างเดียว (jaw ทรงโค้งคีบลูกกลมได้ดี). cube ทำ
# ทีหลัง (jaw โค้งคีบมุม cube ไม่ถนัด ต้องจูน jaw geometry เพิ่ม — ดู docs).
shapes:
  ball:                       # ทรงกลม
    geom_type: sphere
    radius: 0.010             # ~2cm เส้นผ่านศูนย์กลาง
  # cube:                     # ทรงสี่เหลี่ยม (PHASE 2 — ยังคีบไม่เสถียร)
  #   geom_type: box
  #   half_extent: 0.009

# จำนวนชิ้นบนโต๊ะต่อ episode
num_objects: 5

# โซนวางวัตถุบนโต๊ะ (พื้น z=0). สุ่มภายในกรอบนี้ ไม่ให้ชนกัน
spawn_area:
  x: [0.19, 0.31]
  y: [-0.11, 0.11]
  z: 0.015                    # วางบนพื้นโต๊ะ (ตกลงมานิ่งที่ ~ครึ่งความสูงวัตถุ)
  min_separation: 0.06        # ระยะห่างขั้นต่ำระหว่างวัตถุ (กันคีบพลาด)

# ตำแหน่งถาด (bin) — วางด้านข้างหุ่น ให้เอื้อมถึงแต่ไม่ทับโซนวัตถุ
tray:
  pos: [0.05, 0.24, 0.0]      # ซ้ายมือหุ่น
  inner_half: [0.06, 0.06]    # ครึ่งความกว้างช่องใน
  wall_height: 0.03
  wall_thick: 0.006

# มวล/แรงเสียดทานของวัตถุ (จูน grasp ใน sim)
# friction สูง + torsional/rolling สูง ช่วยให้ jaw คีบลูกกลมไม่ลื่นหลุด
# mass เบา ช่วยให้ jaw บีบยกได้ด้วยแรงจำกัด
physics:
  mass: 0.015
  friction: [2.0, 0.2, 0.02]     # sliding / torsional / rolling (สูงกว่าปกติเพื่อคีบติด)
